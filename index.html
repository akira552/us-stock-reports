<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>美股研究報告</title>
<style>
:root{--bg:#fafaf9;--side:#fff;--ink:#1c1c1a;--muted:#6b6b66;--line:#e7e6e1;--hover:#f2f1ed;--on:#ebf2ee;--brand:#1f5f4a;--warn:#b97a2f}
@media (prefers-color-scheme:dark){:root{--bg:#131615;--side:#191d1b;--ink:#e8ece9;--muted:#98a39e;--line:#2a312e;--hover:#222826;--on:#1f2e28;--brand:#5fb08f;--warn:#d9a45c}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;display:flex}
aside{width:272px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}
.brand{padding:18px 18px 10px}
.brand b{font-size:15px;letter-spacing:.02em}.brand div{color:var(--muted);font-size:12px;margin-top:2px}
.search{margin:6px 14px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;width:calc(100% - 28px)}
nav{overflow:auto;flex:1;padding:0 8px 8px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:9px 10px;border-radius:8px;cursor:pointer}
.item:hover{background:var(--hover)}.item.on{background:var(--on)}
.tk{font-weight:700;width:48px;flex:none;font-variant-numeric:tabular-nums}
.nm{flex:1;min-width:0}.nm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .r{color:var(--muted);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--warn)}.dot.reviewed{background:var(--brand)}
.foot{padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;line-height:1.6}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:4px}.legend i.g{background:var(--brand);margin-left:8px}
main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.bar{display:none;align-items:center;gap:10px;padding:10px 14px;background:var(--side);border-bottom:1px solid var(--line)}
.bar button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
.empty{flex:1;display:grid;place-items:center;color:var(--muted)}
.scrim{display:none}
@media (max-width:820px){
 aside{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s;width:min(300px,86vw)}
 body.open aside{transform:none}
 body.open .scrim{display:block;position:fixed;inset:0;background:#0006;z-index:10}
 .bar{display:flex}
}
</style>
</head>
<body>
<aside>
 <div class="brand"><b>美股研究報告</b><div>共 <span id="cnt"></span> 家 · 建置 2026-10-22</div></div>
 <input class="search" id="q" placeholder="搜尋代號或公司" autocomplete="off">
 <nav id="list"></nav>
 <div class="foot"><div class="legend"><i></i>待獨立審查<i class="g"></i>已通過審查</div>研究評等不構成買賣建議。</div>
</aside>
<div class="scrim" id="scrim"></div>
<main>
 <div class="bar"><button id="menu">☰ 公司</button><b id="cur"></b></div>
 <div class="empty" id="empty">請從左側選擇公司</div>
 <iframe id="f" hidden title="研究報告"></iframe>
</main>
<script>
const D=[{"t": "AAPL", "name": "Apple", "rating": "生意 A ／ 價格過熱", "date": "2026-10-12", "status": "reviewed"}, {"t": "ADBE", "name": "Adobe", "rating": "生意 B ／ 價格合理", "date": "2026-10-15", "status": "pending"}, {"t": "AEP", "name": "American Electric Power", "rating": "生意 B ／ 價格偏貴", "date": "2026-10-15", "status": "pending"}, {"t": "COP", "name": "ConocoPhillips", "rating": "生意 B ／ 價格偏貴", "date": "2026-10-15", "status": "pending"}, {"t": "CRM", "name": "Salesforce", "rating": "生意 B ／ 價格偏貴", "date": "2026-10-12", "status": "pending"}, {"t": "DE", "name": "Deere & Company", "rating": "生意 B ／ 價格偏貴", "date": "2026-10-15", "status": "pending"}, {"t": "DUOL", "name": "Duolingo", "rating": "生意 B ／ 價格偏貴", "date": "2026-10-15", "status": "pending"}, {"t": "GOOGL", "name": "Alphabet", "rating": "生意 A ／ 價格偏貴", "date": "2026-10-12", "status": "pending"}, {"t": "NKE", "name": "Nike", "rating": "生意 B ／ 價格偏貴", "date": "2026-10-12", "status": "pending"}, {"t": "ONON", "name": "On Holding", "rating": "生意 B ／ 價格合理", "date": "2026-10-15", "status": "pending"}, {"t": "PGR", "name": "Progressive", "rating": "生意 B ／ 價格合理", "date": "2026-10-15", "status": "pending"}, {"t": "PLD", "name": "Prologis", "rating": "生意品質：依據待使用者核定，暫不評等 ／ 價格合理", "date": "2026-10-15", "status": "pending"}, {"t": "REGN", "name": "Regeneron Pharmaceuticals", "rating": "生意 B ／ 價格偏貴", "date": "2026-10-15", "status": "pending"}, {"t": "SCHW", "name": "Charles Schwab", "rating": "生意 B ／ 價格偏貴", "date": "2026-10-12", "status": "pending"}, {"t": "UAA", "name": "Under Armour", "rating": "生意 C ／ 價格偏貴", "date": "2026-10-15", "status": "pending"}, {"t": "VFC", "name": "VF Corporation", "rating": "生意 B ／ 價格偏貴", "date": "2026-10-15", "status": "pending"}];
const $=id=>document.getElementById(id);
$('cnt').textContent=D.length;
function render(){
 const k=$('q').value.trim().toLowerCase(), cur=location.hash.slice(1);
 $('list').innerHTML=D.filter(c=>!k||(c.t+c.name).toLowerCase().includes(k)).map(c=>
  `<button class="item${c.t===cur?' on':''}" data-t="${c.t}"><span class="tk">${c.t}</span><span class="nm"><span>${c.name}</span><span class="r">${c.rating||'—'}${c.date?' · '+c.date:''}</span></span><i class="dot ${c.status}" title="${c.status==='reviewed'?'已通過審查':'待獨立審查'}"></i></button>`).join('');
}
function open_(t){
 const c=D.find(x=>x.t===t); if(!c) return;
 $('empty').hidden=true; $('f').hidden=false;
 if($('f').dataset.t!==t){$('f').src='reports/'+t+'.html';$('f').dataset.t=t}
 $('cur').textContent=t+' '+c.name; document.title=t+' · 美股研究報告';
 document.body.classList.remove('open'); render();
}
$('list').onclick=e=>{const b=e.target.closest('.item');if(b)location.hash=b.dataset.t};
$('q').oninput=render;
$('menu').onclick=()=>document.body.classList.add('open');
$('scrim').onclick=()=>document.body.classList.remove('open');
addEventListener('hashchange',()=>open_(location.hash.slice(1)));
render(); open_(location.hash.slice(1)||D[0].t);
</script>
</body>
</html>
